name: Bug 报告
description: 报告可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿在 Issue 中粘贴真实凭据、真实账号、真实订单号或用户隐私数据。
        安全问题请走 SECURITY.md 中的私下渠道。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望行为 vs 实际行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. go run ./cmd/agentd
        2. POST /api/goals ...
        3. 观察 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志（已脱敏）
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已移除日志中的凭据与个人信息
          required: true
